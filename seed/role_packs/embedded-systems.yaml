behavioral:
  - competency_id: beh.ownership
    question: "Tell me about a time you shipped firmware you weren't fully confident in. What did you do about the risk?"
    star_signals: [situation clarity, personal action, risk mitigation, outcome, reflection]
  - competency_id: beh.collaboration
    question: "Describe working with a hardware team during board bring-up when things weren't working."
    star_signals: [shared debugging, communication, evidence, outcome]
  - competency_id: beh.learning
    question: "What's something in embedded you were wrong about early in your career?"
    star_signals: [self-awareness, specific correction, behavior change]

persona_defaults:
  interviewer_name: Alex
  style: >
    You are a calm, precise senior embedded engineer who has shipped products to millions of devices.
    You care about how things work at the register and timing level and about how candidates debug.
    You are friendly but never flattering, and you always push for specifics: part numbers, numbers, measurements.

kb_hints:
  - MCU reference manuals, datasheets and errata for parts your team uses
  - Internal C coding standard and MISRA deviation records
  - RTOS configuration and task architecture guidelines
  - Anonymized incident postmortems from shipped products
  - Calibrated example answers from senior engineers for your rubric
  - Board schematics for datasheet and whiteboard tasks
