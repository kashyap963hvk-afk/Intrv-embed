      - {stdin: "00000000 31 1 1\n", expected_stdout: "00000000 80000000\n"}
      - {stdin: "ffffffff 8 4 3\n", expected_stdout: "0000000f fffff3ff\n"}
      - {stdin: "00000000 0 4 1f\n", expected_stdout: "00000000 0000000f\n"}
    rubric_competencies: [emb.c_language]

