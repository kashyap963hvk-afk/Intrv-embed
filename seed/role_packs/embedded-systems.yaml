          return 0;
      }

      /* Return `reg` with the `width`-bit field at `pos` replaced by the low `width` bits of `val`. */
      uint32_t insert_bits(uint32_t reg, unsigned pos, unsigned width, uint32_t val)
      {
          /* candidate implements */
          return 0;
      }

      int main(void)
      {
          unsigned long r, p, w, v;
          while (scanf("%lx %lu %lu %lx", &r, &p, &w, &v) == 4) {
              printf("%08lx %08lx\n",
                     (unsigned long)extract_bits((uint32_t)r, (unsigned)p, (unsigned)w),
                     (unsigned long)insert_bits((uint32_t)r, (unsigned)p, (unsigned)w, (uint32_t)v));
