practical_tasks:
  - id: debug_isr_adc
    kind: DEBUG_SNIPPET
    language: c
    prompt: >
      This firmware samples an ADC in an interrupt and processes samples in the main loop.
      It hangs at -O2 and occasionally processes corrupted data at -O0. Find every bug you can,
      explain the consequence of each, and propose a fix.
    starter_code: |
      #include <stdint.h>
      #include <stdbool.h>

      extern uint16_t adc_read_data_register(void);   /* reads the ADC data register */
      extern void adc_init(void);
      extern void process(const uint16_t *samples, uint32_t count);

      static bool data_ready = false;
      static uint32_t sample_count = 0;
      static uint16_t buffer[64];
      static uint8_t head = 0;

      void ADC_IRQHandler(void)
      {
          buffer[head++] = adc_read_data_register();
          if (head == 64) {
              head = 0;
          }
          sample_count++;
          data_ready = true;
      }

      int main(void)
      {
          adc_init();
          while (1) {
              while (!data_ready) {
              }
              data_ready = false;
              process(buffer, sample_count);
          }
      }
    known_bugs:
      - "data_ready (and other ISR-shared variables) are not volatile, so at -O2 the polling loop can be compiled into an infinite loop"
      - "process() reads buffer while the ISR keeps overwriting it; no double buffering, snapshot or critical section, so data is torn or corrupted"
      - "sample_count grows without bound and is passed as the element count, so process() reads past the end of the 64-element buffer"
      - "no record of which samples are new: head is not used by main, so data order and freshness are undefined"
      - "flag-based handoff loses events if more than one interrupt fires per main-loop iteration; a counter or queue is needed"
    tests: []
    rubric_competencies: [emb.c_language, emb.interrupts_concurrency]

  - id: debug_ring_buffer
    kind: DEBUG_SNIPPET
    language: c
    prompt: >
      This ring buffer is written from a UART RX interrupt (rb_put) and read from the main loop (rb_get).
      Users report corrupted bytes and occasional crashes. Find the bugs and fix them.
    starter_code: |
      #include <stdint.h>
      #include <stdbool.h>

      #define RB_SIZE 8

      typedef struct {
          uint8_t data[RB_SIZE];
          uint8_t head;
          uint8_t tail;
      } rb_t;

      bool rb_put(rb_t *rb, uint8_t b)
      {
          rb->data[rb->head++] = b;
          if (rb->head > RB_SIZE) {
              rb->head = 0;
          }
          return true;
      }

      bool rb_get(rb_t *rb, uint8_t *out)
      {
          if (rb->head == rb->tail) {
              return false;
          }
          *out = rb->data[rb->tail];
          rb->tail = (rb->tail + 1) % RB_SIZE;
          return true;
      }
    known_bugs:
      - "wrap check uses > instead of >=, so head reaches RB_SIZE and the next put writes data[8], out of bounds"
      - "rb_put never checks for full, so it silently overwrites unread data and can make the buffer look empty"
      - "head and tail are shared between ISR and main without volatile (and without barriers on cores with caches or reordering)"
      - "rb_put always returns true, so the caller can never detect overflow; an overflow counter is missing"
    tests: []
    rubric_competencies: [emb.c_language, emb.interrupts_concurrency]

  - id: write_bitfield_helpers
    kind: WRITE_CODE
    language: c
    prompt: >
      Implement extract_bits and insert_bits for 32-bit register manipulation. Handle width 32 correctly
      without undefined behavior, and make sure insert_bits masks val to the field width.
      Input lines are "reg_hex pos width val_hex"; the program prints "extracted_hex inserted_hex".
    starter_code: |
      #include <stdio.h>
