  signup_url: https://console.groq.com/keys
  free_tier: true
  trains_on_data: null
  notes: Very low latency; a good fit for voice interviews. Free tier is rate-limited.
  default_rpm: 30
  default_rpd: 1000
  supports: {stream: true, json_schema: true, json_object: true, tools: true, vision: false}
  model_hints: [llama-3.3-70b-versatile]

