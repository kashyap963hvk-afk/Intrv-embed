# LLM provider presets. DATA, not code: edit freely. Model lists are fetched live from GET {base_url}/models;
# `model_hints` are only suggestions. Free tiers and data policies change often; verify on the provider's site.
#
# trains_on_data: true  = the provider's terms allow using prompts to improve models (on the tier described)
#                 false = the provider states API data is not used for training by default
#                 null  = unknown / depends on routing: treated like `true` when the org blocks PII on such providers

- key: gemini
  display_name: Google Gemini (AI Studio, OpenAI-compatible)
  kind: OPENAI_COMPATIBLE
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  requires_api_key: true
  docs_url: https://ai.google.dev/gemini-api/docs/openai
  signup_url: https://aistudio.google.com/apikey
  free_tier: true
  trains_on_data: true
  notes: Free tier prompts may be used to improve Google products; use a paid key for candidate data.
  default_rpm: 10
  default_rpd: 250
  supports: {stream: true, json_schema: true, json_object: true, tools: true, vision: true}
  model_hints: [gemini-2.5-flash, gemini-2.5-pro]

- key: groq
  display_name: Groq
