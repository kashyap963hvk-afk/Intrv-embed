[project]
name = "intrv-backend"
version = "0.1.0"
description = "Intrv-embed backend: API, agent engine and workers"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "anyio>=4.15.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.114",
    "celery[redis]>=5.6.3",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "pydantic[email]>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    "aiosmtplib>=5.1.3",
    "openai>=3.33.0",
    "cryptography>=50.0.2",
    "json-repair>=0.64.0",
    "pyyaml>=6.0",
    "httpx2>=2.13.1",
    "qdrant-client>=1.19.1",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "beautifulsoup4>=4.15.0",
    "snowballstemmer>=3.1.1",
    "python-multipart>=0.0.32",
    "filetype>=1.2.0",
    "fastembed>=0.9.0",
    "azure-storage-blob>=12.20",
    "google-auth>=2.30",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "reportlab>=4.4",
]

[project.optional-dependencies]
ocr = [
    "rapidocr-onnxruntime>=1.4.4",
    # Same cv2 module without the GUI build's libGL/glib system dependencies (see [tool.uv] below).
    "opencv-python-headless>=4.10",
]

[tool.uv]
# rapidocr asks for the desktop OpenCV build; the headless wheel provides the same `cv2` for servers.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "workers"]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.114",
    "celery-types>=0.26.0",
    "docker>=7.2.0",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
    "testcontainers>=4.15.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "N", "C4", "PL", "TRY"]
ignore = [
    "PLR0913",  # FastAPI dependency-injected handlers legitimately take many parameters
    "PLR0917",  # same, for positional parameters
    "TRY003",   # descriptive messages in exceptions are preferred over exception subclasses per message
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S603", "S607", "PLR0911", "E501"]
# Migrations interpolate only constant table/function names into DDL (never input) and embed long SQL.
"migrations/**" = ["S608", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app", "workers"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["snowballstemmer", "pdfplumber.*", "docx.*", "pptx.*", "openpyxl.*", "filetype.*", "fastembed.*", "docling.*", "reportlab.*", "rapidocr_onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs Docker (testcontainers); run with -m integration",
    "live: needs real external credentials; skipped unless the env vars are present",
    "isolation: tenant/space isolation suite; must pass before any commit touching db, acl, rag, api or agents",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff.lint.isort]
known-first-party = ["app", "workers", "tests"]
