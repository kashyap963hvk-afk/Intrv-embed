[project]
name = "intrv-backend"
version = "0.1.0"
description = "Intrv-embed backend: API, agent engine and workers"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anyio>=4.15.1",
    "asyncpg>=0.32.0",
    "boto3>=1.43.114",
    "celery[redis]>=5.6.3",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "workers"]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.114",
    "celery-types>=0.26.0",
    "docker>=7.2.0",
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "testcontainers>=4.15.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "N", "C4", "PL", "TRY"]
ignore = [
    "PLR0913",  # FastAPI dependency-injected handlers legitimately take many parameters
    "TRY003",   # descriptive messages in exceptions are preferred over exception subclasses per message
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app", "workers"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs Docker (testcontainers); run with -m integration",
    "live: needs real external credentials; skipped unless the env vars are present",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff.lint.isort]
known-first-party = ["app", "workers", "tests"]
