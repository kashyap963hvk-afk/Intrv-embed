[project]
name = "intrv-bridge"
version = "0.1.0"
description = "Local Model Bridge for Intrv-embed: serve a model on your PC or pendrive to your interview workspace"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "websockets>=16.0",
    "httpx>=0.28",
    "gguf>=0.17",
    "psutil>=7.0",
    "platformdirs>=4.3",
]

[project.optional-dependencies]
tray = ["pystray>=0.19", "pillow>=11"]

[project.scripts]
intrv-bridge = "intrv_bridge.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9", "mypy>=1.14"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intrv_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.mypy]
strict = true
ignore_missing_imports = true
