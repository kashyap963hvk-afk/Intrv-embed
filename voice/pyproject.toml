[project]
name = "intrv-voice"
version = "0.1.0"
description = "Intrv-embed voice worker: WebRTC audio, VAD, turn detection, STT and TTS around the interview engine"
requires-python = ">=3.12,<3.13"
license = "BSD-2-Clause"
dependencies = [
    "pipecat-ai[silero,webrtc,local-smart-turn-v3,whisper]==1.13.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "websockets>=16.0",
    "httpx>=0.28",
    "pydantic-settings>=2.7",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9", "mypy>=1.14"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intrv_voice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [  # both raised inside pipecat itself
    "ignore:'audioop' is deprecated:DeprecationWarning",
    "ignore:`AudioContextTTSService` is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.mypy]
strict = true
ignore_missing_imports = true
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
