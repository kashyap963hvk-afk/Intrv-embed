name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: OpenAPI snapshot is current
        run: uv run python -m app.export_openapi | diff -u openapi.json -
      - name: Tests (unit + integration with testcontainers)
        env:
          REQUIRE_DOCKER: "1"
        run: uv run pytest -m "not live"

  bridge:
    name: Local Model Bridge (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: bridge/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  voice:
    name: Voice worker (lint, types, offline pipeline tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: voice/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: https://api.example.com
      NEXT_PUBLIC_WS_BASE_URL: wss://api.example.com
      NEXT_PUBLIC_APP_URL: https://app.example.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: API types match backend/openapi.json
        run: npm run check:api
      - run: npm run build

  security:
    name: Security (secrets, dependency audits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
      - name: pip-audit (production dependencies)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --disable-pip --require-hashes
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: npm audit (production dependencies, blocking)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (dev dependencies, report only; see docs/adr/0001)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Bandit (backend, bridge, voice, tts; medium and high)
        run: uvx bandit==1.9.2 -r backend/app backend/workers bridge/src voice/src tts -q -ll
      - name: Semgrep (OWASP Top 10 + Python rules; errors block)
        run: >-
          uvx --from semgrep==1.140.0 --with "pydantic<2.12" semgrep scan
          --config p/python --config p/owasp-top-ten --severity ERROR --error --metrics off
          backend/app bridge/src voice/src tts frontend/src

  production-config:
    name: Production compose and Caddy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compose file resolves with every profile
        run: |
          python3 scripts/gen_env.py
          printf 'APP_ENV=prod\nAPI_DOMAIN=api.example.com\nFILES_DOMAIN=files.example.com\nAPP_DOMAIN=app.example.com\nACME_EMAIL=ops@example.com\n' >> .env
          docker compose -f deploy/compose.prod.yml --env-file .env --profile frontend --profile voice --profile coding config --quiet
      - name: Caddyfile is valid
        run: >-
          docker run --rm -v "$PWD/deploy/caddy:/etc/caddy:ro" -e ACME_EMAIL=ops@example.com
          -e API_DOMAIN=api.example.com -e FILES_DOMAIN=files.example.com caddy:2.10.2-alpine
          caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Backup script parses
        run: sh -n deploy/backup/run.sh

  e2e:
    name: End-to-end (compose stack + Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Start the core stack
        run: make env && make up
      - name: Playwright browsers
        working-directory: e2e
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: e2e
        run: npx playwright test
      - name: Logs on failure
        if: failure()
        run: docker compose --profile core logs --tail=200 backend worker frontend
