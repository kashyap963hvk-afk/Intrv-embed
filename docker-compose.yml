# Intrv-embed local stack.  First run:  make env && make up
#
# Profiles (docs/ARCHITECTURE.md §21):
#   core          data stores + backend + worker + beat + frontend (dev mode); fastembed models in-process
#   models        Text Embeddings Inference (CPU): bge-m3 + bge-reranker-v2-m3 (set EMBED_BACKEND=tei, see .env.example)
#   gpu           CUDA TEI images (override TEI_IMAGE)          voice   voice worker + Kokoro TTS + coturn
#   coding        Phase 8: Piston (+ optional Renode)          prod    Phase 10: Caddy + production images
#   observability Phase 10: OpenTelemetry collector
# Profiles listed for later phases are added together with the code that needs them.
#
# All ports bind to 127.0.0.1 only. Secrets come from .env (generated by `make env`).

name: intrv

x-backend: &backend
  build:
    context: ./backend
    target: dev
  image: intrv-backend:dev
  env_file: .env
  extra_hosts:
    # Lets self-host presets reach servers on the Docker host (llama-server, LM Studio) on Linux too.
    - "host.docker.internal:host-gateway"
  volumes:
    - ./backend/app:/app/app
    - ./backend/workers:/app/workers
    - ./backend/migrations:/app/migrations
    - ./backend/seed:/app/seed:ro
    - models:/models
  depends_on:
    migrate:
      condition: service_completed_successfully
    valkey:
      condition: service_healthy
    qdrant:
      condition: service_healthy
    s3-init:
      condition: service_completed_successfully
    mailpit:
      condition: service_started
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    profiles: [core]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?run `make env` first}
      APP_OWNER_DB_PASSWORD: ${APP_OWNER_DB_PASSWORD:?run `make env` first}
      APP_RW_DB_PASSWORD: ${APP_RW_DB_PASSWORD:?run `make env` first}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intrv"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1.10-alpine
    profiles: [core]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?run `make env` first}
    command: ["sh", "-c", 'exec valkey-server --requirepass "$$VALKEY_PASSWORD" --appendonly yes']
    volumes:
      - valkeydata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", 'valkey-cli -a "$$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.2
    profiles: [core]
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?run `make env` first}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrantdata:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    profiles: [core]
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run `make env` first}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?run `make env` first}
    volumes:
      - ./infra/seaweedfs/entrypoint.sh:/entrypoint.sh:ro
      - seaweeddata:/data
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  s3-init:
    image: amazon/aws-cli:2.38.1
    profiles: [core]
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-intrv}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for i in $$(seq 1 30); do
        aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null && exit 0;
        aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket "$$S3_BUCKET" && exit 0;
        sleep 2; done; echo "could not create bucket $$S3_BUCKET" >&2; exit 1
    restart: "no"

  migrate:
    image: intrv-backend:dev
    build:
      context: ./backend
      target: dev
    profiles: [core]
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    volumes:
      - ./backend/migrations:/app/migrations
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.6
    profiles: [core]
    ports:
      - "127.0.0.1:8025:8025"   # web UI: http://localhost:8025
    restart: unless-stopped

  backend:
    <<: *backend
    profiles: [core]
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 12

  worker:
    <<: *backend
    profiles: [core]
    command: ["celery", "-A", "workers.celery_app:celery_app", "worker", "-Q", "ingest,grade,sync,default", "--concurrency", "2", "--loglevel", "INFO"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A workers.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  beat:
    <<: *backend
    profiles: [core]
    command: ["celery", "-A", "workers.celery_app:celery_app", "beat", "--schedule", "/tmp/celerybeat-schedule", "--loglevel", "INFO"]

  frontend:
    build:
      context: ./frontend
      target: dev
    image: intrv-frontend:dev
    profiles: [core]
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_BASE_URL: ${NEXT_PUBLIC_WS_BASE_URL:-ws://localhost:8000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_GOOGLE_APP_ID: ${NEXT_PUBLIC_GOOGLE_APP_ID:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  tei-embed:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4}
    profiles: [models]
    command: ["--model-id", "BAAI/bge-m3", "--port", "80", "--max-client-batch-size", "64"]
    volumes:
      - teidata:/data
    ports:
      - "127.0.0.1:8081:80"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80"]   # TEI listens only once the model is loaded
      interval: 15s
      timeout: 5s
      retries: 60   # first start downloads ~2.3 GB
    restart: unless-stopped

  tei-rerank:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4}
    profiles: [models]
    command: ["--model-id", "BAAI/bge-reranker-v2-m3", "--port", "80"]
    volumes:
      - teidata:/data
    ports:
      - "127.0.0.1:8082:80"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80"]   # TEI listens only once the model is loaded
      interval: 15s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  # --- voice (Phase 7) -------------------------------------------------------------------------------------
  # WebRTC media uses ephemeral UDP ports, so the voice worker and coturn use the host network (Linux hosts).
  voice:
    build:
      context: ./voice
    image: intrv-voice:dev
    profiles: [voice]
    network_mode: host
    env_file: .env
    environment:
      BACKEND_WS_URL: ws://127.0.0.1:8000
      TTS_URL: http://127.0.0.1:8880
    depends_on:
      tts:
        condition: service_healthy
    restart: unless-stopped

  tts:
    build:
      context: ./tts
    image: intrv-tts:dev
    profiles: [voice]
    ports:
      - "127.0.0.1:8880:8880"
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.7.0
    profiles: [voice]
    network_mode: host
    command:
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:-}
      - --realm=${TURN_REALM:-intrv.local}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --fingerprint
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
    restart: unless-stopped

volumes:
  models:
  teidata:
  pgdata:
  valkeydata:
  qdrantdata:
  seaweeddata:
